<!DOCTYPE html>
<html>
<head>
    <meta name="description" content="Scientifically proven brain training game improves working memory. This web app allows you to analyze and export advanced statistics on your progress over time."/>

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta property="og:title" content="Dual N-Back Game" />
    <meta property="og:site_name" content="Dual-N-Back.io" />
    <meta property="og:type" content="game" />
    <meta property="og:url" content="https://irisdominguez.github.io/Dual-N-Back/" />
    <meta property="og:image" content="https://irisdominguez.github.io/Dual-N-Back/img/icon512.png" />
    <meta property="og:description" content="Dual N-Back: scientifically proven brain training game. Improve your working memory. This mobile-optimized web app allows you to analyze and export advanced statistics to track your progress over time." />
    <title>Dual N-Back</title>
    <link rel="manifest" href="manifest.manifest" />
    <link rel="canonical" href="https://irisdominguez.github.io/Dual-N-Back/" />
    
    <script src="chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #ddd;
            border: 2px solid #999;
            transition: background-color 0.3s;
        }

        .active {
            background-color: #4CAF50;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn.pressed {
            background-color: #4CAF50;
            color: white;
            transform: scale(0.95);
            transition: all 0.1s;
        }

        .stats {
            margin: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        canvas {
            margin: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Dual N-Back (N=<span id="level">1</span>)</h1>
    <div class="stats">
        <div>Score: <span id="score">0</span>/20</div>
        <div>Audio Accuracy: <span id="audioAcc">0</span>%</div>
        <div>Position Accuracy: <span id="posAcc">0</span>%</div>
    </div>
    <div class="grid" id="grid">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>
    <div class="controls">
        <div id="gameControls" style="display: none;">
            <button class="btn" id="audioBtn">🔊 Audio Match (F)</button>
            <button class="btn" id="positionBtn">📍 Position Match (J)</button>
        </div>
        <div id="startControl">
            <button class="btn" id="startBtn">▶️ Start Game</button>
        </div>
    </div>
    <button id="showStats">Show Statistics</button>
    <canvas id="statsCanvas" width="600" height="300" style="display: none;"></canvas>

    <script>
        class DualNBack {
            constructor() {
                this.N = parseInt(localStorage.getItem('currentLevel')) || 1;
                this.score = 0;
                this.history = JSON.parse(localStorage.getItem('history')) || [];
                this.audioTimes = [];
                this.posTimes = [];
                this.lastStepTime = 0;
                this.audioCorrect = 0;
                this.audioTotal = 0;
                this.posCorrect = 0;
                this.posTotal = 0;
                this.currentStep = 0;
                this.running = false;
                this.audioStack = [];
                this.visualStack = [];

                this.setupEventListeners();
                this.updateLevel();
                
                this.toggleControls(false);
            }

            setupEventListeners() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === ' ' && !this.running) {
                        this.start();
                        this.addButtonPress('startBtn');
                        return;
                    }

                    if (!this.running) return;

                    if (e.key === 'f') {
                        this.checkAudioMatch();
                        this.addButtonPress('audioBtn');
                    }
                    if (e.key === 'j') {
                        this.checkPositionMatch();
                        this.addButtonPress('positionBtn');
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (e.key === 'f') {
                        this.removeButtonPress('audioBtn');
                    }
                    if (e.key === 'j') {
                        this.removeButtonPress('positionBtn');
                    }
                    if (e.key === ' ') {
                        this.removeButtonPress('startBtn');
                    }
                });

                document.getElementById('audioBtn').onclick = () => {
                    this.checkAudioMatch();
                    this.addButtonPress('audioBtn');
                    setTimeout(() => this.removeButtonPress('audioBtn'), 100);
                };
                document.getElementById('positionBtn').onclick = () => {
                    this.checkPositionMatch();
                    this.addButtonPress('positionBtn');
                    setTimeout(() => this.removeButtonPress('positionBtn'), 100);
                };
                document.getElementById('startBtn').onclick = () => {
                    this.start();
                    this.addButtonPress('startBtn');
                    setTimeout(() => this.removeButtonPress('startBtn'), 100);
                };
                document.getElementById('showStats').onclick = () => this.toggleStats();
            }

            addButtonPress(buttonId) {
                const button = document.getElementById(buttonId);
                if (button) button.classList.add('pressed');
            }

            removeButtonPress(buttonId) {
                const button = document.getElementById(buttonId);
                if (button) button.classList.remove('pressed');
            }

            buildStacks() {
                const N_plus = 20;
                let [visual_stack, auditory_stack] = this.generateStacks(N_plus);
                this.visualStack = visual_stack;
                this.audioStack = auditory_stack;
            }

            generateStacks(N_plus) {
                let next = -1;
                const N = this.N;  // Current n-back level

                let visual_matches = [];
                let auditory_matches = [];

                // Choose four random timesteps for visual matches
                while (visual_matches.length < 4) {
                    next = Math.floor(Math.random() * (N_plus));
                    if (visual_matches.indexOf(next + N) === -1) {
                        visual_matches.push(next + N);
                    }
                }

                // Choose four random timesteps for auditory matches
                while (auditory_matches.length < 4) {
                    next = Math.floor(Math.random() * (N_plus));
                    if (auditory_matches.indexOf(next + N) === -1 && 
                        visual_matches.indexOf(next + N) === -1) {
                        auditory_matches.push(next + N);
                    }
                }

                // Choose two random timesteps for double matches
                while (auditory_matches.length < 6) {
                    next = Math.floor(Math.random() * (N_plus));
                    if (auditory_matches.indexOf(next + N) === -1 && 
                        visual_matches.indexOf(next + N) === -1) {
                        auditory_matches.push(next + N);
                        visual_matches.push(next + N);
                    }
                }

                // Initialize stacks with random positions for first N rounds
                let visual_stack = [];
                let auditory_stack = [];

                while (visual_stack.length < N) {
                    next = Math.floor(Math.random() * 9);
                    if (visual_stack.indexOf(next) === -1) {
                        visual_stack.push(next);
                    }
                }

                while (auditory_stack.length < N) {
                    next = Math.floor(Math.random() * 10);
                    if (auditory_stack.indexOf(next) === -1) {
                        auditory_stack.push(next);
                    }
                }

                // Fill the rest of the stacks ensuring matches at predetermined positions
                while (visual_stack.length < N_plus + N) {
                    if (visual_matches.indexOf(visual_stack.length) !== -1) {
                        // Create a match by copying the position from N steps ago
                        visual_stack.push(visual_stack[visual_stack.length - N]);
                    } else {
                        // Add a new random position, avoiding match
                        next = Math.floor(Math.random() * 8);
                        if (next >= visual_stack[visual_stack.length - N]) {
                            next += 1;
                        }
                        visual_stack.push(next);
                    }
                }

                while (auditory_stack.length < N_plus + N) {
                    if (auditory_matches.indexOf(auditory_stack.length) !== -1) {
                        // Create a match by copying the number from N steps ago
                        auditory_stack.push(auditory_stack[auditory_stack.length - N]);
                    } else {
                        // Add a new random number, avoiding match
                        next = Math.floor(Math.random() * 9);
                        if (next >= auditory_stack[auditory_stack.length - N]) {
                            next += 1;
                        }
                        auditory_stack.push(next);
                    }
                }

                return [visual_stack, auditory_stack];
            }
            
            toggleControls(gameRunning) {
                document.getElementById('gameControls').style.display = gameRunning ? 'flex' : 'none';
                document.getElementById('startControl').style.display = gameRunning ? 'none' : 'flex';
            }

            start() {
                this.running = true;
                this.toggleControls(true);
                this.hideStats();
                this.buildStacks();
                this.currentStep = 0;
                this.score = 0;
                this.audioCorrect = 0;
                this.audioTotal = 0;
                this.posCorrect = 0;
                this.posTotal = 0;
                this.audioTimes = [];
                this.posTimes = [];
                this.updateScore();
                this.runStep();
            }

            runStep() {
                if (this.currentStep >= 20) {
                    this.endRound();
                    return;
                }

                const cell = this.visualStack[this.currentStep];
                const audio = this.audioStack[this.currentStep];

                this.clearGrid();
                document.getElementsByClassName('cell')[cell].classList.add('active');
                
                const audioElement = new Audio(`audio/en-${audio}.mp3`);
                audioElement.play();
                
                this.lastStepTime = performance.now();

                this.currentStep++;
                setTimeout(() => {
                    this.clearGrid();
                    setTimeout(() => {
                        if (this.running) this.runStep();
                    }, 1500);
                }, 500);
            }

            checkAudioMatch() {
                if (this.currentStep <= this.N) return;

                this.audioTotal++;
                const isMatch = this.audioStack[this.currentStep-1] === this.audioStack[this.currentStep-1-this.N];
                if (isMatch) {
                    this.audioCorrect++;
                    this.audioTimes.push(performance.now() - this.lastStepTime);
                }
                
                this.updateScore();
            }

            checkPositionMatch() {
                const startTime = performance.now();
                if (this.currentStep <= this.N) return;

                this.posTotal++;
                const isMatch = this.visualStack[this.currentStep-1] === this.visualStack[this.currentStep-1-this.N];
                if (isMatch) {
                    this.posCorrect++;
                    this.posTimes.push(performance.now() - this.lastStepTime);
                }
                
                this.updateScore();
            }

            clearGrid() {
                document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('active'));
            }

            updateScore() {
                document.getElementById('score').textContent = this.currentStep;
                document.getElementById('audioAcc').textContent = 
                    ((this.audioCorrect / Math.max(1, this.audioTotal)) * 100).toFixed(1);
                document.getElementById('posAcc').textContent = 
                    ((this.posCorrect / Math.max(1, this.posTotal)) * 100).toFixed(1);
            }

            endRound() {    
                this.running = false;
                this.toggleControls(false);
                const totalAcc = (this.audioCorrect + this.posCorrect) / 
                                Math.max(1, this.audioTotal + this.posTotal);

                this.history.push({
                    date: new Date(),
                    level: this.N,
                    audioTime: this.audioTimes.reduce((a,b) => a+b, 0) / this.audioTimes.length,
                    posTime: this.posTimes.reduce((a,b) => a+b, 0) / this.posTimes.length
                });

                localStorage.setItem('history', JSON.stringify(this.history));

                if (totalAcc > 0.85) this.N++;
                else if (totalAcc < 0.7) this.N = Math.max(1, this.N - 1);

                this.updateLevel();
                this.drawStats();
            }

            updateLevel() {
                document.getElementById('level').textContent = this.N;
                localStorage.setItem('currentLevel', this.N);
            }

            toggleStats() {
                const canvas = document.getElementById('statsCanvas');
                const showingStats = canvas.style.display === 'none';
                canvas.style.display = showingStats ? 'block' : 'none';
                if (showingStats) this.drawStats();
            }
            
            hideStats() {
                const canvas = document.getElementById('statsCanvas');
                canvas.style.display = 'none';
            }

            drawStats() {
                const canvas = document.getElementById('statsCanvas');
                
                // Destroy previous chart if it exists
                if (this.chart) {
                    this.chart.destroy();
                }

                const ctx = canvas.getContext('2d');
                
                // Process last 30 days of data
                const last30Days = this.history.slice(-30);
                const dates = last30Days.map(h => new Date(h.date).toLocaleDateString());
                const levels = last30Days.map(h => h.level);
                const audioTimes = last30Days.map(h => h.audioTime);
                const posTimes = last30Days.map(h => h.posTime);

                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'N-Back Level',
                            data: levels,
                            borderColor: 'rgb(75, 192, 192)',
                            yAxisID: 'y-level',
                            tension: 0.1
                        }, {
                            label: 'Audio Response Time (ms)',
                            data: audioTimes,
                            borderColor: 'rgb(255, 99, 132)',
                            yAxisID: 'y-time',
                            tension: 0.1
                        }, {
                            label: 'Position Response Time (ms)',
                            data: posTimes,
                            borderColor: 'rgb(54, 162, 235)',
                            yAxisID: 'y-time',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        scales: {
                            'y-level': {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'N-Back Level'
                                },
                                min: 0
                            },
                            'y-time': {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Response Time (ms)'
                                },
                                min: 0,
                                grid: {
                                    drawOnChartArea: false
                                }
                            }
                        }
                    }
                });
            }
        }

        const game = new DualNBack();
        document.getElementById('startBtn').onclick = () => game.start();
    </script>
</body>
</html>
